[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cider-ws"
version = "0.1.0"
description = "Python client SDK for Cider v1 WebSocket API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0" }
authors = [{ name = "Cider Collective" }]
dependencies = [
  "websockets>=12.0,<13.0"
]

[project.scripts]
cider-ws = "cider_ws.cli:main"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["cider_ws*"]
